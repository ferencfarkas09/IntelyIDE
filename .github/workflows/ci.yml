# Pull-request gate (design notes: release-ci-spec 5.3). No secret, no environment, no write permission, no artifact hop.
# Every gate runs through a repo script so the owner can run the identical command locally:
#   scripts/release/gate.sh --ci-js | --ci-gates | --ci-rust
# The one required status check of `main` is `ci-ok` (X8). Third-party actions are pinned by commit SHA; an
# unresolved pin is filled by `node scripts/ci/pin-actions.mjs --apply` (the strict lint in `lint-workflows` fails until then).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_VERSION: "1.96.0"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

jobs:
  lint-workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node scripts/ci/check-workflows.mjs --strict
      - run: node scripts/ci/check-refs.mjs --strict
      - run: bash scripts/ci/run-actionlint.sh

  js:
    # G02 typecheck, G03 unit tests, G09 SDK absent from the sidecar, G11 UI build (gate.sh --ci-js)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/ci/js-gates.sh
      - if: failure()
        run: for f in .scratch/gate/*/G*.log; do echo "::group::$f"; tail -n 200 "$f"; echo "::endgroup::"; done

  gates:
    # G01 G06 G07 G08 (changed files) G10 G13 G14 G16 G17 G18 (gate.sh --ci-gates)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GIT_CONFIG_GLOBAL: /dev/null
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install "$RUST_VERSION" --profile minimal && rustup default "$RUST_VERSION"
      - run: cargo fetch --locked
      - run: bash scripts/release/gate.sh --ci-gates
      - if: failure()
        run: for f in .scratch/gate/*/G*.log; do echo "::group::$f"; tail -n 200 "$f"; echo "::endgroup::"; done

  dco:
    # Signed-off-by on every commit of the pull request (public spec R20, D-P13). The bot exemption compares the
    # pull request AUTHOR login (event payload, passed through env), never a commit author string.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node scripts/release/check-dco.mjs --range "$BASE_SHA..$HEAD_SHA" --bot-login 'dependabot[bot]' --pr-author "$PR_AUTHOR"

  i18n-full:
    # continue-on-error: decision RD6 (the machine catalogs are red until the translation run); informational.
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm i18n:check

  publish-scan-full:
    # continue-on-error: decision RD7 (the full-tree scan stays advisory until the scrub of the public spec lands).
    # Only the number of lines is written to the summary: the scanner's file names come from the pull request.
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: |
          rc=0
          pnpm licenses:publish-scan > "$RUNNER_TEMP/publish-scan.txt" 2>&1 || rc=$?
          n="$(wc -l < "$RUNNER_TEMP/publish-scan.txt" | tr -d ' ')"
          echo "publish-scan (full tree): exit $rc, $n output lines" >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

  rust:
    # G04 cargo test, G05 bindings drift, G20 release-cfg compile check (gate.sh --ci-rust)
    runs-on: macos-15
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install "$RUST_VERSION" --profile minimal && rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-aarch64
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - run: pnpm --filter @intely/sidecar build # the host tests start the real sidecar bundle; sidecar/dist is not tracked
      - run: bash scripts/release/gate.sh --ci-rust
      - if: failure()
        run: for f in .scratch/gate/*/G*.log; do echo "::group::$f"; tail -n 200 "$f"; echo "::endgroup::"; done

  deny:
    # G12 supply-chain policy (deny.toml). The action is Linux only.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  release-verify:
    # Public spec 4.6: the public-tree and claims checks on every pull request; each script exists in the tree.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:test
      - run: pnpm release:verify
      - run: pnpm release:no-telemetry
      - run: pnpm release:check-docs
      - run: pnpm release:check-readme
      - run: pnpm licenses:check
      - run: pnpm licenses:publish-scan

  build-smoke:
    # The debug build with the UI embedded (frontendDist, sidecar path, Tauri config); not part of ci-ok.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install "$RUST_VERSION" --profile minimal && rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-aarch64
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - run: bash scripts/ci/build-smoke.sh

  ci-ok:
    # The ONE required status check. `if: always()` so a failed or skipped need cannot leave it unreported.
    if: always()
    needs: [lint-workflows, js, gates, rust, deny, dco, dependency-review, release-verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node scripts/ci/ci-ok.mjs
