# Scheduled advisories, pin verification and Node security report (design notes: release-ci-spec 5.5). No secrets.
# Every job is a report only (RD13/RD16: advisory until the owner decides otherwise); results go to the job log and
# summary, no issue is created. Weekly, plus on demand.
name: Audit
on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:
permissions: {}
concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cargo-advisories:
    continue-on-error: true # RD7/G12: advisories are reported weekly, the blocking check is the ci.yml deny job
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with: { command: check advisories }
  pnpm-audit:
    continue-on-error: true # RD7: advisory only, the registry audit endpoint is outside our control
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24 }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm audit --prod --audit-level=high
  pins-verify:
    continue-on-error: true # RD16: pin verification is a report; drift or an imposter commit is fixed by a reviewed pull request
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24 }
      - name: Verify pins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/pin-actions.mjs --verify
  node-security:
    continue-on-error: true # packaging G4: the Node pin changes only by a human procedure, this job only reports
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24 }
      - run: node scripts/ci/node-security.mjs
