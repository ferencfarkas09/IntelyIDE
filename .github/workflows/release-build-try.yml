# Windows and Linux installers of a release. No secret, no environment, read-only token. Nothing is published from here:
# `pnpm release` (scripts/release/release.sh) starts this workflow for the commit the macOS disk image was built from, waits for it,
# downloads the two artifacts (release-linux, release-windows), checks them and attaches them to the draft GitHub release.
# The Windows files are not code-signed. The macOS disk image is built, signed and notarized on the maintainer's own Mac.
name: Release build try

run-name: release-build-try

on:
  push:
    branches: [feat/multiplatform-ci]
    paths: ['.github/workflows/release-build-try.yml.disabled']

permissions: {}

concurrency:
  group: release-build-try
  cancel-in-progress: false

env:
  RUST_VERSION: "1.96.0"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-22.04
            bundles: appimage,deb
          - platform: windows
            os: windows-2025
            bundles: nsis,msi
    defaults:
      run:
        shell: bash
    env:
      INPUT_COMMIT: ${{ github.sha }}
      BUNDLES: ${{ matrix.bundles }}
      PLATFORM: ${{ matrix.platform }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Check the inputs
        run: |
          [[ "$INPUT_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "commit must be a full 40-character SHA"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: The checkout is the commit and its version
        run: |
          [ "$(git rev-parse HEAD)" = "$INPUT_COMMIT" ] || { echo "checked out $(git rev-parse HEAD), expected $INPUT_COMMIT"; exit 1; }
          node scripts/release/check-version.mjs
          echo "INPUT_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: rustup toolchain install "$RUST_VERSION" --profile minimal && rustup default "$RUST_VERSION"
      - name: Linux packages
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libsecret-1-dev patchelf libssl-dev libxdo-dev file
      - run: node --version && pnpm --version && rustc --version
      - run: pnpm install --frozen-lockfile
      # beforeBuildCommand of tauri.conf.json builds the sidecar and the UI; the relay kit (remote-web, its own root) is built here first
      - run: pnpm -w run build:relay-kit
      - run: pnpm --filter @intely/sidecar build
      - name: Build the installers
        run: pnpm exec tauri build --bundles "$BUNDLES" --ci -- --locked
      - name: Name the files for the release
        run: node scripts/release/stage-artifacts.mjs --platform "$PLATFORM" --version "$INPUT_VERSION" --bundle-dir "$CARGO_TARGET_DIR/release/bundle" --out "$RUNNER_TEMP/staged"
      - name: SHA-256 of the files
        run: cd "$RUNNER_TEMP/staged" && sha256sum -- *
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.platform }}
          path: ${{ runner.temp }}/staged/*
          if-no-files-found: error
          retention-days: 14
