name: Feature request
description: Suggest an idea or an improvement.
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please describe the problem first; the solution can follow.
        Do not include private repository names, paths or tokens.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Changes and Git
        - Agents
        - Remote
        - Database
        - Preview
        - i18n
        - Other
    validations:
      required: true
  - type: checkboxes
    id: ack
    attributes:
      label: Acknowledgement
      options:
        - label: I searched existing issues and discussions, and I understand requests are handled by one maintainer and may take time.
          required: true
