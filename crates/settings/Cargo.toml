[package]
name = "intely-settings"
version = "0.0.0"
edition = "2021"
rust-version = "1.77"
license.workspace = true
publish = false

[lib]
name = "intely_settings"

[features]
specta = ["dep:specta", "dep:specta-typescript", "dep:specta-serde"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
specta = { version = "=2.0.0-rc.25", optional = true, features = ["derive"] }
specta-serde = { version = "0.0.12", optional = true }
specta-typescript = { version = "0.0.12", optional = true }

[[example]]
name = "gen_bindings"
required-features = ["specta"]

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.6.0"

# Windows Credential Manager and the Secret Service of Linux (GNOME Keyring, KWallet) behind the same `keyring-core` interface; the
# stores are pure Rust (no libdbus, no libsecret). See `secrets.rs`, module `os_store`.
[target.'cfg(windows)'.dependencies]
keyring-core = "1.0.0"
windows-native-keyring-store = "1.1.0"

[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies]
keyring-core = "1.0.0"
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }

[dev-dependencies]
tempfile = "3.27.0"
