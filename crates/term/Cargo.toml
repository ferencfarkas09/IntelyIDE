[package]
name = "intely-term"
version = "0.0.0"
edition = "2021"
rust-version = "1.77"
license.workspace = true
publish = false

[lib]
name = "intely_term"

[features]
specta = ["dep:specta", "dep:specta-typescript", "dep:specta-serde"]

[dependencies]
intely-agent-gate = { path = "../agent_gate" }
intely-core = { path = "../core" }
libc = "0.2.190"
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
specta = { version = "=2.0.0-rc.25", optional = true, features = ["derive"] }
specta-serde = { version = "0.0.12", optional = true }
specta-typescript = { version = "0.0.12", optional = true }

[[example]]
name = "gen_bindings"
required-features = ["specta"]

[dev-dependencies]
serde_json = "1.0.151"
tempfile = "3.27.0"
