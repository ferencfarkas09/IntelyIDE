[package]
name = "intely-attachments"
version = "0.0.0"
edition = "2021"
rust-version = "1.77"
license.workspace = true
publish = false

[lib]
name = "intely_attachments"

[dependencies]
intely-core = { version = "0.0.0", path = "../core" }
intely-agent-core = { version = "0.0.0", path = "../agent_core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
uuid = { version = "1.20.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
