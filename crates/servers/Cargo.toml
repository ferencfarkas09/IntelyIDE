[package]
name = "intely-servers"
version = "0.0.0"
edition = "2021"
rust-version = "1.77"
license.workspace = true
description = "Remote SSH servers: config validation, probe, setup, repo checks and the sidecar start command. No async runtime, no ssh library: the system ssh binary."
publish = false

[lib]
name = "intely_servers"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
