[package]
name = "intely-preview-proxy"
version = "0.0.0"
edition = "2021"
rust-version = "1.77"
license.workspace = true
description = "Loopback reverse proxy for the embedded preview: injects the click-to-source inspector into HTML, passes SSE and WebSocket traffic through"
publish = false

[lib]
name = "intely_preview_proxy"

[dependencies]
httparse = "1.10.1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }

[dev-dependencies]
tempfile = "3.27.0"
