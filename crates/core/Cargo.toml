[package]
name = "intely-core"
version = "0.0.0"
edition = "2021"
rust-version = "1.77"
license.workspace = true

[lib]
name = "intely_core"

[features]
specta = ["dep:specta", "dep:specta-typescript"]

[dependencies]
hex = "0.4.3"
ignore = "0.4.30"
libc = "0.2.190"
notify = { version = "8.2.0", default-features = false, features = ["macos_fsevent"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
specta = { version = "=2.0.0-rc.25", optional = true, features = ["derive"] }
specta-typescript = { version = "0.0.12", optional = true }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "process", "sync", "time", "macros", "io-util", "fs", "signal"] }
unicode-normalization = "0.1.25"
uuid = { version = "1.20.0", features = ["v4"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
specta-serde = "0.0.12"
tempfile = "3.27.0"

[[example]]
name = "gen_bindings"
required-features = ["specta"]
