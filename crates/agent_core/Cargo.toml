[package]
name = "intely-agent-core"
version = "0.0.0"
edition = "2021"
rust-version = "1.77"
license.workspace = true

[lib]
name = "intely_agent_core"

[features]
specta = ["dep:specta", "dep:specta-typescript", "dep:specta-serde"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
specta = { version = "=2.0.0-rc.25", optional = true, features = ["derive", "serde_json"] }
specta-serde = { version = "0.0.12", optional = true }
specta-typescript = { version = "0.0.12", optional = true }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["sync"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3.27.0"

[[example]]
name = "gen_protocol"
required-features = ["specta"]
