[package]
name = "intely-relay-deploy"
version = "0.0.0"
edition = "2021"
rust-version = "1.77"
license.workspace = true
description = "Relay kit discovery, wrangler invocation builder and runner with masking, output parsers, config generator and deploy pipeline for the user's own Cloudflare account (docs/remote-cloudflare-spec.md). Nothing runs until a Tauri command calls it."

[lib]
name = "intely_relay_deploy"

[dependencies]
hex = "0.4.3"
intely-core = { version = "0.0.0", path = "../core" }
intely-relay-bundle = { version = "0.0.0", path = "../relay_bundle" }
intely-runner = { version = "0.0.0", path = "../runner" }
intely-settings = { version = "0.0.0", path = "../settings" }
libc = "0.2.190"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt", "time", "net"] }
url = "2.5.8"
zeroize = "1.9.0"

[dev-dependencies]
tempfile = "3.27.0"
