[package]
name = "intely-runindex"
version = "0.0.0"
edition = "2021"
rust-version = "1.77"
license.workspace = true

[lib]
name = "intely_runindex"

[dependencies]
intely-agent-core = { path = "../agent_core" }
intely-checks = { path = "../checks" }
intely-core = { path = "../core" }
intely-runner = { path = "../runner" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
tempfile = "3.27.0"
