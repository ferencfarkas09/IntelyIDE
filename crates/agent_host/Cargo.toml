[package]
name = "intely-agent-host"
version = "0.0.0"
edition = "2021"
rust-version = "1.77"
license.workspace = true
publish = false

[lib]
name = "intely_agent_host"

[dependencies]
intely-agent-core = { path = "../agent_core" }
intely-agent-gate = { path = "../agent_gate" }
intely-core = { path = "../core" }
intely-servers = { path = "../servers" }
libc = "0.2.190"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
uuid = { version = "1.20.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
