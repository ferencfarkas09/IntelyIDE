[package]
name = "intely-roles"
version = "0.0.0"
edition = "2021"
rust-version = "1.77"
license.workspace = true

[lib]
name = "intely_roles"

[features]
specta = ["dep:specta", "dep:specta-typescript", "dep:specta-serde", "intely-agent-core/specta"]

[dependencies]
intely-agent-core = { path = "../agent_core" }
intely-agent-gate = { path = "../agent_gate" }
intely-agent-host = { path = "../agent_host" }
intely-core = { path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
specta = { version = "=2.0.0-rc.25", optional = true, features = ["derive"] }
specta-serde = { version = "0.0.12", optional = true }
specta-typescript = { version = "0.0.12", optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[[example]]
name = "gen_bindings"
required-features = ["specta"]
