[package]
name = "intely-mobilehealth"
version = "0.0.0"
edition = "2021"
rust-version = "1.77"
license.workspace = true
publish = false

[lib]
name = "intely_mobilehealth"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Unix: files are reached through directory handles that never follow a link (src/safefs.rs)
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["fs", "std"] }

[dev-dependencies]
tempfile = "3.27.0"
