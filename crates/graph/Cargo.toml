[package]
name = "intely-graph"
version = "0.0.0"
edition = "2021"
rust-version = "1.77"
license.workspace = true
publish = false

[lib]
name = "intely_graph"

[features]
specta = ["dep:specta", "dep:specta-typescript", "dep:specta-serde", "intely-core/specta"]

[dependencies]
intely-core = { version = "0.0.0", path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
specta = { version = "=2.0.0-rc.25", optional = true, features = ["derive"] }
specta-serde = { version = "0.0.12", optional = true }
specta-typescript = { version = "0.0.12", optional = true }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "fs", "macros"] }
uuid = { version = "1.20.0", features = ["v4"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3.27.0"

[[example]]
name = "gen_bindings"
required-features = ["specta"]
