[package]
name = "intely-happy"
version = "0.0.0"
edition = "2021"
rust-version = "1.77"
license.workspace = true

[lib]
name = "intely_happy"

[features]
specta = ["dep:specta", "dep:specta-typescript", "dep:specta-serde"]

[dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
intely-core = { version = "0.0.0", path = "../core" }
intely-settings = { version = "0.0.0", path = "../settings" }
reqwest = { version = "0.13.3", default-features = false, features = ["native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
specta = { version = "=2.0.0-rc.25", optional = true, features = ["derive"] }
specta-serde = { version = "0.0.12", optional = true }
specta-typescript = { version = "0.0.12", optional = true }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "native-tls"] }
url = "2.5.8"

[[example]]
name = "gen_bindings"
required-features = ["specta"]

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["io-util", "net", "test-util"] }
