name: Release
on: { push: { tags: ["v*"] } }
permissions: {}
jobs:
  sign:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - env:
          HAVE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
          IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
        run: bash scripts/ci/run-sign.sh
      - env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: bash scripts/release-mac.sh --arch "$ARCH" --ci --stage verify --dynamic --out out
