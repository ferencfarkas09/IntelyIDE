name: CodeQL
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
permissions: {}
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@1111111111111111111111111111111111111111 # v7.0.1
        with: { persist-credentials: false }
      - uses: github/codeql-action/init@2222222222222222222222222222222222222222 # v4.1.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@2222222222222222222222222222222222222222 # v4.1.0
  codeql-rust:
    # RD8: non-blocking until one successful run has been seen
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@1111111111111111111111111111111111111111 # v7.0.1
        with: { persist-credentials: false }
      - uses: github/codeql-action/init@2222222222222222222222222222222222222222 # v4.1.0
        with: { languages: rust, build-mode: none }
      - uses: github/codeql-action/analyze@2222222222222222222222222222222222222222 # v4.1.0
