[workspace]
members = ["crates/core", "crates/agent_core", "crates/agent_gate", "crates/agent_host", "crates/files", "crates/term", "crates/graph", "crates/roles", "crates/settings", "crates/happy", "crates/attachments", "crates/l10n","crates/mongo", "crates/runner", "crates/preview-proxy", "crates/remote", "crates/checks", "crates/gitx", "crates/hud", "crates/contract", "crates/runindex", "crates/relay_bundle", "crates/relay_deploy", "crates/pathpick", "crates/updater", "crates/mcp", "src-tauri"]
resolver = "2"

[workspace.package]
license = "GPL-3.0-or-later"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# The contract scanner walks thousands of files: keep it fast in dev builds too.
[profile.dev.package.intely-contract]
opt-level = 2
